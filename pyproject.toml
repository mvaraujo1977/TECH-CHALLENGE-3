[project]
name = "assistente-medico"
version = "0.1.0"
description = "Assistente clínico de apoio à decisão — Tech Challenge Fase 3"
requires-python = ">=3.10"

dependencies = [
    # LangChain
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.1.4",
    "langgraph>=0.2.0",
    # Vector store e embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Modelo
    "transformers>=4.44",
    "peft>=0.13",
    "torch>=2.0",
    "accelerate>=0.34",
    # Utilitários
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Quantização 4-bit — só funciona com GPU NVIDIA
gpu = ["bitsandbytes>=0.44"]
# Suíte de testes — roda sem GPU e sem baixar modelo
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
